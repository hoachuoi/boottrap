<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <h1> Nguyễn Xuân Bắc</h1>
    <div class="container">
        <button class="btn btn-primary">Primary</button>
        <button class="btn btn-outline-primary">Outline Primary</button>
        <button class="btn btn-secondary">Secondary</button>
        <button class="btn btn-success">Success</button>
        <button class="btn btn-danger">Danger</button>
        <button class="btn btn-warning">Warning</button>
        <button class="btn btn-info">Info</button>
        <button class="btn btn-light">Light</button>
        <button class="btn btn-dark">Dark</button>
        <button class="btn btn-link">Link</button>
    </div>
    <div class="container form-container mt-3">
        <form action="" >
            <div class="row mt-3">
                <div class="col-3">
                    <label class="form-label" for="email">email</label>
                </div>
                <div class="col-6">
                    <input class="form-control" type="email" name="email" id="email">
                </div>
            </div>
            <div class="row mt-3">
                <div class="col-3">
                    <label class="form-label" for="password">password</label>
                </div>
                <div class="col-6">
                    <input class="form-control" type="password" name="password" id="password">
                </div>
            </div>
            <div class="row mt-3">
                <div class="col-3">
                    <label for="select">Select</label>
                </div>
                <div class="col-6">
                    <select class="form-select" name="select" id="select">
                        <option value="1">1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                    </select>
                </div>
            </div>
            <div class="row mt-3">
                <div class="col-3">
                    <label for="textarea">Textarea</label>
                </div>
                <div class="col-6">
                    <textarea class="form-control" name="" id="textarea" cols="30" rows="10"></textarea>
                </div>
            </div>
            <!-- <div class="form-check form-switch"> -->
            <div class="form-check">
                <input class="from-check-input" type="checkbox" id="checkbox">
                <label for="checkbox">Checkbox1</label>
            </div>
            <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="checkbox">
                <label class="form-check-label" for="checkbox">Checkbox1</label>
            </div>
            <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="checkbox">
                <label class="form-check-label" for="checkbox">Checkbox2</label>
            </div>
            
           </form>
    </div>
</body>
</html>
